name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    name: testes da logica (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Testes Unity no computador
        run: pio test -e native -v

  firmware:
    name: build ${{ matrix.placa }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        placa: [uno, esp32dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.placa }}-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Compilar firmware
        run: pio run -e ${{ matrix.placa }}
