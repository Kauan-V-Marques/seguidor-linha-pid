; Seguidor de linha com controle PID
; Placas: Arduino Uno/Nano (6 sensores) e ESP32 DevKit (8 sensores)
; Testes da lógica no computador: pio test -e native

[platformio]
default_envs = uno

[env]
test_framework = unity
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -Wall

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -Wall

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
